<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站备案中 - 豆姜科技</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .notice {
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
        .notice-title {
            color: #0ea5e9;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .contact {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .contact-item {
            color: #64748b;
            font-size: 0.9rem;
            margin: 8px 0;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .logo { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">豆姜科技</div>
        <div class="icon">🔧</div>
        <h1>网站备案中</h1>
        <p>根据《互联网信息服务管理办法》规定，网站正在进行 ICP 备案。</p>
        <p>备案期间网站暂停访问，预计 7-20 个工作日内完成。</p>
        
        <div class="notice">
            <div class="notice-title">备案信息</div>
            <p style="margin: 0; font-size: 0.9rem;">主办单位：豆姜科技<br>备案域名：djkj.top</p>
        </div>
        
        <div class="contact">
            <div class="contact-item">如有疑问，请联系：</div>
            <div class="contact-item">邮箱：yuzhiyu@doujiangai.cn</div>
            <div class="contact-item">电话：13247819985</div>
        </div>
    </div>
</body>
</html>
